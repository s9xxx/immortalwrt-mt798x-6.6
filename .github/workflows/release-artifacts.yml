# 从产物补发 Release：不重新编译，把某个已完成 run 的 artifact 直接发布为 Release。
# 用途：手动触发编译时若未勾选 make_release，编译成功但产物只在 Actions 里，
#       用本 workflow 传入该 run 的 ID 即可补发，避免为发布重编 1.5~2 小时。
name: 从产物补发 Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '源 run ID（Actions 页面 URL 里 /runs/ 后的数字）'
        type: string
        required: true
      tag:
        description: 'Release tag（如 immortalwrt-mtk-mediatek-filogic-20261111）'
        type: string
        required: true
      title:
        description: 'Release 标题（留空则用 tag）'
        type: string
        required: false
      notes:
        description: 'Release 说明（可多行）'
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    name: 📦 补发 Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 下载源 run 产物并发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -e
          RID='${{ inputs.run_id }}'
          TAG='${{ inputs.tag }}'
          TITLE='${{ inputs.title }}'
          [ -n "$TITLE" ] || TITLE="$TAG"

          echo ">>> 校验源 run: $RID"
          CONC=$(gh run view "$RID" --json conclusion --jq .conclusion)
          echo ">>> 源 run conclusion: $CONC"
          [ "$CONC" = "success" ] || { echo "::error::源 run 未成功，拒绝发布"; exit 1; }

          # 抓取 artifact 列表（绝对路径 + 单页，规避 gh --paginate 相对路径 404）
          gh api "repos/$GH_REPO/actions/runs/$RID/artifacts?per_page=100" > /tmp/arts.raw
          python3 - <<'PY' > /tmp/artlist
          import json
          raw = open('/tmp/arts.raw').read().strip()
          dec, idx, objs = json.JSONDecoder(), 0, []
          while idx < len(raw):
              while idx < len(raw) and raw[idx] in ' \n\r\t': idx += 1
              if idx >= len(raw): break
              obj, idx = dec.raw_decode(raw, idx)
              objs.append(obj)
          for o in objs:
              for a in o.get('artifacts', []):
                  if not a.get('expired'):
                      print(a['id'], a['name'])
          PY
          echo "===== artifact 列表 ====="
          cat /tmp/artlist
          [ -s /tmp/artlist ] || { echo "::error::没有可用 artifact"; exit 1; }

          mkdir -p out && cd out
          while read -r id name; do
            echo ">>> 下载 artifact: $name ($id)"
            gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "$name.zip"
            unzip -q -o "$name.zip" -d . && rm -f "$name.zip"
          done < /tmp/artlist
          echo "===== 待发布文件 ====="
          ls -lh

          cat > notes.md <<EOF
          $NOTES

          ---
          - 来源: run $RID（artifact 补发）
          - 发布时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG 已存在，请换一个 tag"; exit 1
          fi

          gh release create "$TAG" ./* \
            --title "$TITLE" \
            --notes-file notes.md
          echo ">>> 已发布: $TAG"
